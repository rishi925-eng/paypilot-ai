services:
  # 1. PayPilot Express & AI Backend Service
  - type: web
    name: paypilot-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npx prisma db push --schema=prisma/schema.prisma && npx tsx prisma/seed.ts && npm run build --prefix apps/api
    startCommand: npm run start --prefix apps/api
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        value: demo_paypal_client_id
      - key: PAYPAL_CLIENT_SECRET
        value: demo_paypal_client_secret
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ORIGIN
        value: "*"

  # 2. PayPilot Next.js Web Frontend Service
  - type: web
    name: paypilot-web
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --prefix apps/web
    startCommand: npm run start --prefix apps/web
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: paypilot-api
          property: host
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        value: demo_paypal_client_id
