name: PayPilot CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./prisma/dev.db"
      PAYPAL_MODE: "sandbox"
      AI_PROVIDER: "mock"
      NODE_ENV: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm install
          npm install --prefix packages/contracts
          npm install --prefix apps/api
          npm install --prefix apps/web

      - name: Build Contracts
        run: |
          npm run build --prefix packages/contracts

      - name: Sync Database Schema & Seed
        run: |
          npx prisma generate
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Run Backend Unit & Integration Tests
        run: |
          npm test --prefix apps/api

      - name: Next.js Frontend Build Check
        run: |
          npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"
