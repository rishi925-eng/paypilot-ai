version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: paypilot-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: paypilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: paypilot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: paypilot-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/paypilot_db?schema=public"
      PAYPAL_MODE: sandbox
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - postgres
      - ollama

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: paypilot-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - api

volumes:
  pgdata:
  ollama_models:
